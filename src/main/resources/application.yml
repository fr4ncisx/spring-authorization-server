server:
  port: '${SERVER_PORT:9000}'
  allowed-origins: '${ALLOWED_ORIGINS_URI_CORS:http://localhost:3000}'

spring:
  application:
    name: auth-server
  threads:
    virtual:
      enabled: true
  web:
    error:
      include-stacktrace: never
  datasource:
    url: '${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}'
    username: '${SPRING_DATASOURCE_USERNAME:postgres}'
    password: '${SPRING_DATASOURCE_PASSWORD:postgres}'
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

services:
  user-service:
    url: '${USER_SERVICE_URL:http://localhost:8081}'
    connect-timeout: 2000
    read-timeout: 4000

uri:
  login-redirect: '${LOGIN_REDIRECT:http://127.0.0.1:8080/login/oauth2/code/oauth2-client}'
  logout-redirect: '${LOGOUT_REDIRECT:http://127.0.0.1:8080/}'

security:
  rsa:
    key-id: '${RSA_KEY_ID:auth-server-key-1}'
  secret-key: '${CLIENT_SECRET:test-secret-key-32-chars-long-minimum!}'
  authserver-uri: '${AUTHSERVER_URI:http://localhost:9000}'
  token:
    uri: '${TOKEN_URI:http://localhost:9000/oauth2/token}'

oauth2:
  client:
    scope: '${CLIENT_USER_SERVICE_SCOPE:user.read}'
  clientid:
    service-client: '${CLIENTID_USER_SERVICE:user-client}'
    oidc-client: '${CLIENTID_OIDC:oidc-client}'